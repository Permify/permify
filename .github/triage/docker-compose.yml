name: triage

networks:
  # No route to the internet by default.
  internal:
    internal: true

services:
  db-latest:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: permify
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-reported:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: permify
    networks: [internal]
    profiles: ["reported"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Always started: the latest published release, pulled from GHCR rather than built from
  # source, so the agent tests exactly what a user would run.
  permify-latest:
    image: ghcr.io/permify/permify:latest
    command: ["serve"]
    depends_on:
      db-latest:
        condition: service_healthy
    networks: [default, internal]
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://postgres:postgres@db-latest:5432/permify?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
    ports:
      - "3476:3476" # REST, host-side readiness checks only
      - "3478:3478" # gRPC
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr", "localhost:3478"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # Started only when the issue names a released version different from latest.
  permify-reported:
    image: ghcr.io/permify/permify:${REPORTED_VERSION:-latest}
    command: ["serve"]
    profiles: ["reported"]
    depends_on:
      db-reported:
        condition: service_healthy
    networks: [default, internal]
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: postgres://postgres:postgres@db-reported:5432/permify?sslmode=disable
      PERMIFY_DATABASE_AUTO_MIGRATE: "true"
    ports:
      - "3486:3476"
      - "3488:3478"
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr", "localhost:3478"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
